name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Foundation contract
        run: npm run check:foundation

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:client

      - name: Type check
        run: npm run typecheck:client

      - name: Test
        run: npm run test:client

      - name: Build
        run: npm run build:client

      - name: Dependency audit
        run: npm audit --audit-level=high

  server:
    name: Server quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Elearning.sln

      - name: Format check
        run: dotnet format Elearning.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Elearning.sln -c Release --no-restore

      - name: Test
        run: dotnet test Elearning.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Vulnerable package check
        run: dotnet list Elearning.sln package --vulnerable --include-transitive

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build application images
        run: docker compose build backend frontend
